name: Infinity MCP Toolbox CI

on:
  push:
    branches: [main]
    paths:
      - "mcp-tools/**"
      - ".github/workflows/mcp-tools.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp-tools/**"
      - ".github/workflows/mcp-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools

    strategy:
      matrix:
        node-version: ["18", "20", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-tools/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
