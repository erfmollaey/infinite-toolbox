name: PortPilot npm Publish

on:
  push:
    tags:
      - 'portpilot-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing PortPilot release tag (e.g., portpilot-v0.1.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PACKAGE_DIR: portpilot

permissions:
  contents: read
  id-token: write

concurrency:
  group: portpilot-publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag format
        run: |
          TAG="${RELEASE_TAG}"
          echo "Selected tag: $TAG"
          if ! [[ "$TAG" =~ ^portpilot-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid PortPilot tag format: $TAG"
            echo "Expected format: portpilot-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Tag format OK"

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#portpilot-v}"
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate package.json version matches tag
        run: |
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PKG_VERSION"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "ERROR: Version mismatch!"
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match OK"

      - name: Validate package name
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $PKG_NAME"
          if [[ "$PKG_NAME" != "infinity-portpilot" ]]; then
            echo "ERROR: Package name mismatch!"
            echo "Expected: infinity-portpilot"
            echo "Got: $PKG_NAME"
            exit 1
          fi
          echo "Package name OK"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: portpilot/package-lock.json

      - name: Ensure npm >= 11.5.1
        run: |
          npm --version
          npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public