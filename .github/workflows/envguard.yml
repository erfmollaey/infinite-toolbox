name: EnvGuard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envguard

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format src tests --check

      - name: Type check
        run: mypy src tests

      - name: Build package
        run: python -m build

      - name: CLI smoke test
        run: |
          envguard --version
          envguard --help

      - name: Environment check smoke test
        run: envguard check --strict /tmp